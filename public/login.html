<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dangal Fitness System - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link id="bi-css" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <script src="js/theme.js"></script>
</head>
<body>
  <button class="btn btn-outline-secondary btn-sm theme-fab" data-theme-toggle type="button"><i class="bi bi-circle-half" aria-hidden="true"></i><span data-theme-label></span></button>
  <div class="container-fluid">
    <div class="row min-vh-100">

      <div class="col-lg-7 d-none d-lg-flex flex-column justify-content-center p-5 login-hero">
        <h1 class="display-4 fw-bold"><i class="bi bi-lightning-charge-fill brand-accent" aria-hidden="true"></i> DANGAL <span class="brand-accent">FITNESS</span></h1>
        <p class="lead mb-5">Gym Membership &amp; Attendance System</p>

        <div class="row g-3">
          <div class="col-md-4">
            <div class="feature-box h-100">
              <i class="bi bi-people-fill feature-icon" aria-hidden="true"></i>
              <h6>Members</h6>
              <small>Register members and manage their membership plans.</small>
            </div>
          </div>
          <div class="col-md-4">
            <div class="feature-box h-100">
              <i class="bi bi-calendar-check-fill feature-icon" aria-hidden="true"></i>
              <h6>Attendance</h6>
              <small>Check members in and out with one button.</small>
            </div>
          </div>
          <div class="col-md-4">
            <div class="feature-box h-100">
              <i class="bi bi-receipt feature-icon" aria-hidden="true"></i>
              <h6>Payments &amp; Classes</h6>
              <small>Record payments with receipts and book classes.</small>
            </div>
          </div>
        </div>
      </div>

      <main class="col-12 col-lg-5 d-flex align-items-center justify-content-center p-4">
        <div class="card login-card shadow w-100" style="max-width: 420px;">
          <div class="card-body p-4">
            <div class="login-logo"><i class="bi bi-lightning-charge-fill" aria-hidden="true"></i></div>
            <h3 class="text-center mb-1">Dangal Fitness System</h3>
            <p class="text-center text-muted">Please log in to continue</p>

            <div id="message" class="alert alert-danger d-none" role="alert"></div>

            <div class="row g-3">
              <div class="col-12">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-fill" aria-hidden="true"></i></span>
                  <input type="text" id="username" class="form-control" maxlength="50" autocomplete="username">
                </div>
              </div>
              <div class="col-12">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
                  <input type="password" id="password" class="form-control" maxlength="50" autocomplete="current-password">
                </div>
              </div>
              <div class="col-12">
                <button id="loginBtn" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Log In</button>
              </div>
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script>
    const message = document.getElementById('message');

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (username === '' || password === '') {
        message.textContent = 'Please enter your username and password.';
        message.classList.remove('d-none');
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = 'index.html';
        } else {
          message.textContent = data.error;
          message.classList.remove('d-none');
        }
      } catch (err) {
        message.textContent = 'Cannot reach the server. Is it running?';
        message.classList.remove('d-none');
      }
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
