<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dangal Fitness System - Manage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link id="bi-css" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <script src="js/theme.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <main class="container mt-4">

    <div class="row align-items-center mb-2">
      <div class="col-12 col-md-6">
        <h3 class="mb-2 mb-md-0"><i id="pageIcon" class="bi bi-grid-fill" aria-hidden="true"></i> <span id="pageTitle"></span></h3>
      </div>
      <div class="col-12 col-md-6 text-md-end">
        <button id="addBtn" class="btn btn-primary d-none"><i class="bi bi-plus-lg" aria-hidden="true"></i>Add New</button>
      </div>
    </div>
    <p id="pageNote" class="text-muted d-none"></p>

    <!-- Check-in board (attendance only) -->
    <section id="boardSection" class="d-none mb-4" aria-label="Check-in and check-out">
      <div class="card">
        <div class="card-header"><i class="bi bi-person-check-fill" aria-hidden="true"></i>Check-In / Check-Out</div>
        <div class="card-body">
          <div class="row g-2 mb-3">
            <div class="col-12 col-md-6">
              <label for="boardSearch" class="visually-hidden">Find a member</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                <input type="text" id="boardSearch" class="form-control" placeholder="Find a member..." maxlength="50" autocomplete="off">
              </div>
            </div>
          </div>
          <div id="boardList" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"></div>
        </div>
      </div>
    </section>

    <h5 class="d-none mb-3" id="tableTitle"><i class="bi bi-clock-history" aria-hidden="true"></i> <span id="tableTitleText"></span></h5>

    <div class="row g-2 mb-3 align-items-center">
      <div class="col-12 col-md-4">
        <div class="input-group">
          <label for="searchBox" class="visually-hidden">Search</label>
          <input type="text" id="searchBox" class="form-control" placeholder="Search..." maxlength="50">
          <button id="searchBtn" class="btn btn-outline-secondary"><i class="bi bi-search" aria-hidden="true"></i>Search</button>
        </div>
      </div>
      <div class="col-6 col-md-2 d-none" id="filterCol">
        <label for="filterBox" class="visually-hidden">Filter</label>
        <select id="filterBox" class="form-select"></select>
      </div>
      <div class="col-6 col-md-2 d-none" id="sortCol">
        <div class="dropdown">
          <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="sortBtn"
                  data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-arrow-down-up" aria-hidden="true"></i>Sort</button>
          <ul class="dropdown-menu" id="sortMenu" role="menu" aria-labelledby="sortBtn"></ul>
        </div>
      </div>
      <div class="col-6 col-md-2 d-none" id="hiddenCol">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="showHidden">
          <label class="form-check-label" for="showHidden">Show hidden</label>
        </div>
      </div>
      <div class="col-6 col-md-2 ms-md-auto text-md-end">
        <small class="text-muted" id="recordCount"></small>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="table-responsive">
          <table class="table table-sm table-striped table-hover">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="formError" class="alert alert-danger d-none" role="alert"></div>
          <div id="formFields"></div>
          <p class="text-muted small mt-3 mb-0">Fields marked * are required.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-lg" aria-hidden="true"></i>Cancel</button>
          <button type="button" class="btn btn-primary" id="saveBtn"><i class="bi bi-check-lg" aria-hidden="true"></i>Save</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="container text-center py-4">
    <small>Dangal Fitness System &middot; CCS110 Information Management 1</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/common.js"></script>
  <script src="js/config.js"></script>
  <script src="js/manage/state.js"></script>
  <script src="js/manage/table.js"></script>
  <script src="js/manage/sort.js"></script>
  <script src="js/manage/board.js"></script>
  <script src="js/manage/form.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
